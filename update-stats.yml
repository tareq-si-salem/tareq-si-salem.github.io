# .github/workflows/update-stats.yml
#
# Pulls visitor-by-country counts from Cloudflare Web Analytics once a day and
# commits them to data/countries.json, which assets/minimap.js reads.
#
# Secrets — Settings -> Secrets and variables -> Actions -> Secrets tab:
#   CF_API_TOKEN   token with Account Analytics -> Read
#   CF_ACCOUNT_ID  Cloudflare account ID
#   CF_SITE_TAG    Web Analytics site tag for this site
#
# Toggle — same page, Variables tab (not Secrets):
#   SHOW_VISITOR_MAP  off | auto | on     (default: auto)
#   MAP_MIN_VISITS    number, default 250

name: Update visitor stats

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC daily
  workflow_dispatch: # run by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch country metrics
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_SITE_TAG: ${{ secrets.CF_SITE_TAG }}
          SHOW_MAP: ${{ vars.SHOW_VISITOR_MAP || 'auto' }}
          MIN_VISITS: ${{ vars.MAP_MIN_VISITS || '250' }}
        run: |
          set -euo pipefail

          # Fail clearly if a secret is missing, rather than sending a blank
          # request and getting an opaque HTTP 400 back from Cloudflare.
          missing=""
          [ -n "${CF_API_TOKEN}"  ] || missing="${missing} CF_API_TOKEN"
          [ -n "${CF_ACCOUNT_ID}" ] || missing="${missing} CF_ACCOUNT_ID"
          [ -n "${CF_SITE_TAG}"   ] || missing="${missing} CF_SITE_TAG"
          if [ -n "${missing}" ]; then
            echo "::error::Empty secret(s):${missing}"
            echo "Add them as REPOSITORY secrets under Settings -> Secrets and"
            echo "variables -> Actions -> Secrets tab. Environment secrets and"
            echo "repository variables are not visible to this job."
            exit 1
          fi

          DAYS=30
          END=$(date -u +%Y-%m-%dT%H:00:00Z)
          START=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:00:00Z)

          mkdir -p data

          jq -n \
            --arg acct "$CF_ACCOUNT_ID" \
            --arg site "$CF_SITE_TAG" \
            --arg start "$START" \
            --arg end "$END" \
            '{
              query: "query GetCountries($accountTag: string!, $filter: AccountRumPageloadEventsAdaptiveGroupsFilter_InputObject!) { viewer { accounts(filter: { accountTag: $accountTag }) { rumPageloadEventsAdaptiveGroups(filter: $filter, limit: 250, orderBy: [sum_visits_DESC]) { sum { visits } dimensions { countryName } } } } }",
              variables: {
                accountTag: $acct,
                filter: {
                  AND: [
                    { datetime_geq: $start, datetime_leq: $end },
                    { siteTag: $site },
                    { bot: 0 }
                  ]
                }
              }
            }' > query.json

          curl -sS --fail-with-body \
            -X POST "https://api.cloudflare.com/client/v4/graphql" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @query.json \
            -o raw.json

          # GraphQL errors come back with HTTP 200, so check the body
          if jq -e '.errors and (.errors | length > 0)' raw.json > /dev/null; then
            echo "::error::GraphQL returned errors:"
            jq -r '.errors' raw.json
            exit 1
          fi

          jq \
            --argjson days "$DAYS" \
            --arg mode "$SHOW_MAP" \
            --argjson min "$MIN_VISITS" \
            '[ .data.viewer.accounts[0].rumPageloadEventsAdaptiveGroups[]
               | select(.dimensions.countryName != null
                        and .dimensions.countryName != ""
                        and .dimensions.countryName != "T1")
               | {key: .dimensions.countryName, value: (.sum.visits | floor)} ]
             | from_entries as $c
             | ($c | to_entries | map(.value) | add // 0) as $total
             | {
                 updated: (now | todate),
                 days: $days,
                 total: $total,
                 mode: $mode,
                 threshold: $min,
                 enabled: (
                   if   $mode == "on"  then true
                   elif $mode == "off" then false
                   else $total >= $min
                   end
                 ),
                 countries: $c
               }' raw.json > data/countries.json

          rm -f raw.json query.json
          jq -r '"visits: \(.total) | countries: \(.countries | length) | mode: \(.mode) | visible: \(.enabled)"' \
            data/countries.json
          echo "top codes: $(jq -r '.countries | keys | .[0:8] | join(", ")' data/countries.json)"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first: git diff alone cannot see a new untracked file, so on
          # the very first run it would report "no change" and never commit.
          git add data/countries.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "chore: refresh visitor stats"
            git push
            echo "Committed data/countries.json"
          fi
