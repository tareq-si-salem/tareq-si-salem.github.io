# .github/workflows/update-stats.yml
#
# Pulls visitor-by-country counts from Umami Cloud once a day and commits
# them to data/countries.json, which assets/minimap.js reads at page load.
#
# Secrets — Settings -> Secrets and variables -> Actions -> Secrets tab:
#   UMAMI_API_KEY     (Umami: profile -> Settings -> API keys -> Create key)
#   UMAMI_WEBSITE_ID  (the UUID from your tracking snippet)
#
# Toggle — same page, Variables tab (not Secrets):
#   SHOW_VISITOR_MAP  off | auto | on     (default: auto)
#       off   never show the map
#       auto  show it once MAP_MIN_VISITS is reached
#       on    always show it
#   MAP_MIN_VISITS    number, default 250

name: Update visitor stats

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC daily
  workflow_dispatch: # run by hand from the Actions tab after flipping the toggle

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch country metrics
        env:
          API_KEY: ${{ secrets.UMAMI_API_KEY }}
          SITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          SHOW_MAP: ${{ vars.SHOW_VISITOR_MAP || 'auto' }}
          MIN_VISITS: ${{ vars.MAP_MIN_VISITS || '250' }}
        run: |
          set -euo pipefail
          DAYS=30
          END=$(date +%s%3N)
          START=$(( END - DAYS * 86400000 ))

          mkdir -p data

          # Umami Cloud accepts the key as a bearer token; some deployments
          # expect the x-umami-api-key header instead. Sending both is harmless.
          curl -sS --fail-with-body \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${API_KEY}" \
            -H "x-umami-api-key: ${API_KEY}" \
            -G "https://api.umami.is/v1/websites/${SITE_ID}/metrics" \
            --data-urlencode "type=country" \
            --data-urlencode "startAt=${START}" \
            --data-urlencode "endAt=${END}" \
            -o raw.json

          # API returns [{"x":"FR","y":123}, ...]; reshape to {"FR":123,...}
          # and decide visibility from the repo variables.
          jq \
            --argjson days "$DAYS" \
            --arg mode "$SHOW_MAP" \
            --argjson min "$MIN_VISITS" \
            '
            (map(select(.x != null and .x != "")) | map({key: .x, value: .y}) | from_entries) as $c
            | ($c | to_entries | map(.value) | add // 0) as $total
            | {
                updated: (now | todate),
                days: $days,
                total: $total,
                mode: $mode,
                threshold: $min,
                enabled: (
                  if   $mode == "on"  then true
                  elif $mode == "off" then false
                  else $total >= $min
                  end
                ),
                countries: $c
              }' raw.json > data/countries.json

          rm -f raw.json
          jq -r '"visits: \(.total) | countries: \(.countries | length) | mode: \(.mode) | visible: \(.enabled)"' \
            data/countries.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/countries.json; then
            echo "No change."
          else
            git add data/countries.json
            git commit -m "chore: refresh visitor stats"
            git push
          fi
